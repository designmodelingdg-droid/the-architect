intro: "Capacitación BIM para equipos, con profesores certificados por Autodesk, temarios a medida y evaluación antes, durante y después. Online en vivo por Zoom o presencial en las oficinas del cliente."
modalidades:
  - nombre: "Estándar"
    descripcion: "Los programas del catálogo, dictados en vivo para tu equipo, con certificación."
  - nombre: "Personalizada"
    descripcion: "Temario adaptado a los proyectos y el software que usa tu empresa."
  - nombre: "Orientada a la mejora"
    descripcion: "Consultoría de procesos más capacitación: se diagnostica cómo trabaja el equipo y se forma sobre eso."
