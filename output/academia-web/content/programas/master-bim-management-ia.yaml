titulo: "Máster Internacional en BIM Management e Inteligencia Artificial para la Construcción"
tipo: "master"
estado: "publico"
destacado: true
resumen: "Doce meses, cuatro bloques y un proyecto final para dirigir proyectos BIM de punta a punta con inteligencia artificial, con título universitario internacional."
descripcion: "Cuatro bloques progresivos de especialización, BIM Professional, BIM Coordination & Digital Construction, BIM Management y BIM + AI, con once módulos académicos y un proyecto final integrador con defensa ante comité. Cada módulo aprobado entrega una microcredencial; cada bloque completado, una insignia de especialista. Los bloques se pueden cursar por separado y suman hacia el título del máster. Progresión profesional: implementar → coordinar → gestionar → automatizar."
paraQuien:
  - "Ingenieros Civiles y Arquitectos"
  - "Gerentes y Coordinadores de Proyectos"
  - "Coordinadores BIM que buscan escalar a BIM Manager"
  - "Jefes de obra, ingenieros residentes y diseñadores estructurales"
  - "Docentes universitarios del área de construcción"
  - "Profesionales en altos cargos que buscan liderar la transformación digital del sector"
aprenderas:
  - "Liderar y gestionar procesos BIM en proyectos complejos y multidisciplinarios"
  - "Dominar el ecosistema Autodesk: Revit, Navisworks, Civil 3D y Construction Cloud"
  - "Coordinar modelos federados y resolver interferencias con criterio"
  - "Aplicar 4D y 5D integrados al modelo"
  - "Automatizar con Dynamo y Python"
  - "Integrar inteligencia artificial en la toma de decisiones con la DMA Engineering Suite"
  - "Aplicar la ISO 19650 y los protocolos BIM internacionales"
  - "Defender un proyecto final integrador ante comité académico"
modulos:
  - titulo: "Módulo 01: Estrategia BIM y Transformación Digital"
    descripcion: "Bloque 1 · BIM Professional. Establece la visión estratégica del BIM como metodología de gestión de información: el rol del BIM Manager, los requisitos de información del cliente y del proyecto, los estándares que ordenan el trabajo y el flujo documental dentro de un entorno común de datos."
    sesiones:
      - titulo: "Introducción al BIM Management y transformación digital"
        duracion: "Clase + sesión práctica"
      - titulo: "Requisitos de información y gestión BIM: EIR, BEP y Matriz NOI"
        duracion: "Clase + sesión práctica"
      - titulo: "Estándares, normativas y organización BIM (ISO 19650)"
        duracion: "Clase + sesión práctica"
      - titulo: "CDE y flujo de información BIM: WIP, Shared, Published, Archive"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 02: Estándares BIM y Gestión de la Información"
    descripcion: "Bloque 1 · BIM Professional. Desarrolla en profundidad la gestión de información según la ISO 19650 y la construcción de los documentos que gobiernan un proyecto BIM: EIR, AIR, BEP y protocolos de colaboración entre disciplinas."
    sesiones:
      - titulo: "ISO 19650 y gestión de información BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "EIR, AIR y requisitos de información"
        duracion: "Clase + sesión práctica"
      - titulo: "Desarrollo profesional del BEP"
        duracion: "Clase + sesión práctica"
      - titulo: "Protocolos BIM y flujos colaborativos"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 03: Implementación BIM en Empresas y Proyectos"
    descripcion: "Bloque 1 · BIM Professional. Lleva el BIM al plano organizacional: diagnosticar la madurez de una empresa, diseñar el roadmap de implementación, gestionar el cambio y auditar el cumplimiento para asegurar mejora continua."
    sesiones:
      - titulo: "Diagnóstico y madurez BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Plan de implementación BIM y roadmap"
        duracion: "Clase + sesión práctica"
      - titulo: "Gestión del cambio y adopción BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Auditoría BIM y mejora continua"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 04: Ecosistema Autodesk para Coordinación BIM"
    descripcion: "Bloque 2 · BIM Coordination & Digital Construction. Conecta la producción técnica con la gestión: Revit como plataforma de producción de información alineada al EIR, y Navisworks como entorno estratégico de coordinación."
    sesiones:
      - titulo: "Revit como plataforma de producción de información"
        duracion: "Clase + sesión práctica"
      - titulo: "Revit como entorno colaborativo: worksharing, NWC e IFC"
        duracion: "Clase + sesión práctica"
      - titulo: "Navisworks para coordinación estratégica"
        duracion: "Clase + sesión práctica"
      - titulo: "Integración total y proyecto BIM"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 05: Coordinación Multidisciplinaria y Clash Detection"
    descripcion: "Bloque 2 · BIM Coordination & Digital Construction. Profundiza en la preparación de modelos de arquitectura, estructuras y MEP para coordinación, y en el ciclo completo de detección, asignación, resolución y validación de interferencias."
    sesiones:
      - titulo: "Preparación de modelos para coordinación y modelo federado"
        duracion: "Clase + sesión práctica"
      - titulo: "Estrategia de coordinación multidisciplinaria"
        duracion: "Clase + sesión práctica"
      - titulo: "Clash Detection y gestión de incidencias"
        duracion: "Clase + sesión práctica"
      - titulo: "Resolución, validación y reporte"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 06: Construcción Digital y Control Inteligente de Obra"
    descripcion: "Bloque 2 · BIM Coordination & Digital Construction. Conecta el modelo BIM con la obra: preparación para construcción, seguimiento digital del avance, gestión de incidencias en campo y cierre del proyecto con el modelo As-Built."
    sesiones:
      - titulo: "BIM aplicado a la construcción"
        duracion: "Clase + sesión práctica"
      - titulo: "Seguimiento digital del avance"
        duracion: "Clase + sesión práctica"
      - titulo: "QA/QC y gestión digital de incidencias"
        duracion: "Clase + sesión práctica"
      - titulo: "As-Built y cierre digital"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 07: Gestión BIM 4D–7D: Tiempo, Costos y Ciclo de Vida"
    descripcion: "Bloque 3 · BIM Management. Integra las dimensiones superiores del BIM: tiempo, costo, desempeño y operación. Vincular el modelo con cronograma, presupuesto e información del ciclo de vida del activo."
    sesiones:
      - titulo: "BIM 4D: planificación y tiempo"
        duracion: "Clase + sesión práctica"
      - titulo: "BIM 5D: cantidades, presupuestos y costos"
        duracion: "Clase + sesión práctica"
      - titulo: "BIM 6D: desempeño y sostenibilidad"
        duracion: "Clase + sesión práctica"
      - titulo: "BIM 7D: operación y ciclo de vida"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 08: Dirección Estratégica de Proyectos BIM"
    descripcion: "Bloque 3 · BIM Management. Desarrolla las competencias de dirección: planificar estratégicamente un proyecto BIM, organizar equipos y roles, controlar mediante KPI y liderar la toma de decisiones."
    sesiones:
      - titulo: "Planificación estratégica BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Roles, responsabilidades y gobernanza"
        duracion: "Clase + sesión práctica"
      - titulo: "KPI, seguimiento y control"
        duracion: "Clase + sesión práctica"
      - titulo: "Liderazgo y toma de decisiones"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 09: Automatización BIM con Dynamo y Python"
    descripcion: "Bloque 4 · BIM + AI. Introduce la automatización de procesos BIM mediante programación visual y código, con un objetivo concreto: construir un sistema de auditoría QA/QC que valide el modelo contra los requisitos de información."
    sesiones:
      - titulo: "Introducción a Dynamo y automatización BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Gestión inteligente de información BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Sistemas de auditoría QA/QC BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Python aplicado a BIM"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 10: Inteligencia Artificial Aplicada a Proyectos BIM"
    descripcion: "Bloque 4 · BIM + AI. Enseña a usar la IA generativa como copiloto del BIM Manager: interpretar documentación, estructurar requisitos, apoyar el QA/QC y construir asistentes especializados con base de conocimiento propia."
    sesiones:
      - titulo: "Fundamentos de IA aplicada a BIM y prompt engineering"
        duracion: "Clase + sesión práctica"
      - titulo: "IA para gestión de información BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "IA aplicada a QA/QC y coordinación"
        duracion: "Clase + sesión práctica"
      - titulo: "Asistentes especializados BIM"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 11: Automatización BIM Avanzada y Desarrollo de Soluciones"
    descripcion: "Bloque 4 · BIM + AI. Cierra la especialización técnica: diseñar la arquitectura de una solución, programarla con Python avanzado, apoyarse en IA para el desarrollo y entregar herramientas escalables, documentadas y reutilizables."
    sesiones:
      - titulo: "Arquitectura de automatizaciones BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Python avanzado aplicado a BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "IA aplicada a programación BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Desarrollo de soluciones BIM escalables"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 12: Proyecto Final Integrador y Defensa"
    descripcion: "Cierre del Máster. Consolida los cuatro bloques mediante el desarrollo y la sustentación de un proyecto integral aplicado a un caso real, con entregables de nivel profesional y defensa tipo tesis ante el comité académico. Un mes; es requisito de graduación, no un quinto bloque."
    sesiones:
      - titulo: "Definición del proyecto: caso, alcance y requisitos de información"
        duracion: "Clase + sesión práctica"
      - titulo: "Desarrollo y coordinación del modelo BIM federado"
        duracion: "Clase + sesión práctica"
      - titulo: "Gestión, automatización e IA: 4D, 5D, auditoría QA/QC automatizada"
        duracion: "Clase + sesión práctica"
      - titulo: "Presentación profesional y sustentación ante tribunal"
        duracion: "Clase + sesión práctica"
