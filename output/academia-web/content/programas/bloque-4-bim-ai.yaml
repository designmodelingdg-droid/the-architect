titulo: "Bloque 4: BIM + AI"
tipo: "bloque"
estado: "publico"
destacado: false
resumen: "Un trimestre del Máster BIM + IA, cursable por separado y apilable hacia el máster completo. 3 módulos, con microcredencial al terminar."
descripcion: "Automatización e Inteligencia Artificial Aplicada. Transformar procesos BIM mediante automatización, programación e inteligencia artificial, reduciendo tareas manuales y desarrollando soluciones digitales aplicadas. Resultado: automatiza → aplica IA → desarrolla. Es el bloque 4 del Máster Internacional en BIM Management e IA: se cursa por separado, con microcredencial por módulo e insignia de especialista al completarlo, y suma hacia el título del máster."
paraQuien:
  - "Ingenieros Civiles y Arquitectos"
  - "Gerentes y Coordinadores de Proyectos"
  - "Coordinadores BIM que buscan escalar a BIM Manager"
  - "Jefes de obra, ingenieros residentes y diseñadores estructurales"
  - "Docentes universitarios del área de construcción"
  - "Profesionales en altos cargos que buscan liderar la transformación digital del sector"
modulos:
  - titulo: "Módulo 09: Automatización BIM con Dynamo y Python"
    descripcion: "Introduce la automatización de procesos BIM mediante programación visual y código, con un objetivo concreto: construir un sistema de auditoría QA/QC que valide el modelo contra los requisitos de información."
    sesiones:
      - titulo: "Introducción a Dynamo y automatización BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Gestión inteligente de información BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Sistemas de auditoría QA/QC BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Python aplicado a BIM"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 10: Inteligencia Artificial Aplicada a Proyectos BIM"
    descripcion: "Enseña a usar la IA generativa como copiloto del BIM Manager: interpretar documentación, estructurar requisitos, apoyar el QA/QC y construir asistentes especializados con base de conocimiento propia."
    sesiones:
      - titulo: "Fundamentos de IA aplicada a BIM y prompt engineering"
        duracion: "Clase + sesión práctica"
      - titulo: "IA para gestión de información BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "IA aplicada a QA/QC y coordinación"
        duracion: "Clase + sesión práctica"
      - titulo: "Asistentes especializados BIM"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 11: Automatización BIM Avanzada y Desarrollo de Soluciones"
    descripcion: "Cierra la especialización técnica: diseñar la arquitectura de una solución, programarla con Python avanzado, apoyarse en IA para el desarrollo y entregar herramientas escalables, documentadas y reutilizables."
    sesiones:
      - titulo: "Arquitectura de automatizaciones BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Python avanzado aplicado a BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "IA aplicada a programación BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Desarrollo de soluciones BIM escalables"
        duracion: "Clase + sesión práctica"
