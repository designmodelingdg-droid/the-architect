resumen: "Conceptos básicos de diseño sismorresistente de edificaciones de acero estructural: análisis modal, fuerzas sísmicas, compensación de masas y rigideces, diseño de elementos de acero, elementos lineales y de área, memorias. Metodología asincrónica. Programas: Robot Structural Analysis, hojas de cálculo, guías, normativas. Requisitos: conocimientos básicos de construcción y diseño estructural; no requiere manejar Robot."
