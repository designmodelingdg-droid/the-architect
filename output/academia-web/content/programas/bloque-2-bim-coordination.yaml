titulo: "Bloque 2: BIM Coordination & Digital Construction"
tipo: "bloque"
estado: "publico"
destacado: false
resumen: "Un trimestre del Máster BIM + IA, cursable por separado y apilable hacia el máster completo. 3 módulos, con microcredencial al terminar."
descripcion: "Coordinación y Control Digital de Proyectos. Integrar modelos, coordinar disciplinas, detectar interferencias y controlar digitalmente la información durante el desarrollo del proyecto. Resultado: integra → coordina → controla. Es el bloque 2 del Máster Internacional en BIM Management e IA: se cursa por separado, con microcredencial por módulo e insignia de especialista al completarlo, y suma hacia el título del máster."
paraQuien:
  - "Ingenieros Civiles y Arquitectos"
  - "Gerentes y Coordinadores de Proyectos"
  - "Coordinadores BIM que buscan escalar a BIM Manager"
  - "Jefes de obra, ingenieros residentes y diseñadores estructurales"
  - "Docentes universitarios del área de construcción"
  - "Profesionales en altos cargos que buscan liderar la transformación digital del sector"
modulos:
  - titulo: "Módulo 04: Ecosistema Autodesk para Coordinación BIM"
    descripcion: "Conecta la producción técnica con la gestión: Revit como plataforma de producción de información alineada al EIR, y Navisworks como entorno estratégico de coordinación."
    sesiones:
      - titulo: "Revit como plataforma de producción de información"
        duracion: "Clase + sesión práctica"
      - titulo: "Revit como entorno colaborativo: worksharing, NWC e IFC"
        duracion: "Clase + sesión práctica"
      - titulo: "Navisworks para coordinación estratégica"
        duracion: "Clase + sesión práctica"
      - titulo: "Integración total y proyecto BIM"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 05: Coordinación Multidisciplinaria y Clash Detection"
    descripcion: "Profundiza en la preparación de modelos de arquitectura, estructuras y MEP para coordinación, y en el ciclo completo de detección, asignación, resolución y validación de interferencias."
    sesiones:
      - titulo: "Preparación de modelos para coordinación y modelo federado"
        duracion: "Clase + sesión práctica"
      - titulo: "Estrategia de coordinación multidisciplinaria"
        duracion: "Clase + sesión práctica"
      - titulo: "Clash Detection y gestión de incidencias"
        duracion: "Clase + sesión práctica"
      - titulo: "Resolución, validación y reporte"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 06: Construcción Digital y Control Inteligente de Obra"
    descripcion: "Conecta el modelo BIM con la obra: preparación para construcción, seguimiento digital del avance, gestión de incidencias en campo y cierre del proyecto con el modelo As-Built."
    sesiones:
      - titulo: "BIM aplicado a la construcción"
        duracion: "Clase + sesión práctica"
      - titulo: "Seguimiento digital del avance"
        duracion: "Clase + sesión práctica"
      - titulo: "QA/QC y gestión digital de incidencias"
        duracion: "Clase + sesión práctica"
      - titulo: "As-Built y cierre digital"
        duracion: "Clase + sesión práctica"
