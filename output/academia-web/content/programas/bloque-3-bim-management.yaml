resumen: "Un trimestre del Máster BIM + IA, cursable por separado y apilable hacia el máster completo. 2 módulos, con microcredencial al terminar."
descripcion: "Planificación, Costos y Gestión Integral. Evolucionar desde la coordinación técnica hacia la planificación, control y dirección estratégica de proyectos BIM, incorporando tiempo, costos, operación y toma de decisiones. Resultado: planifica → controla → decide → lidera. Es el bloque 3 del Máster Internacional en BIM Management e IA: se cursa por separado, con microcredencial por módulo e insignia de especialista al completarlo, y suma hacia el título del máster."
