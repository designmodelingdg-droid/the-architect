    descripcion: "Desarrolla las competencias de dirección: planificar estratégicamente un proyecto BIM, organizar equipos y roles, controlar mediante KPI y liderar la toma de decisiones."
    sesiones:
      - titulo: "Planificación estratégica BIM"
        duracion: "Clase + sesión práctica"
