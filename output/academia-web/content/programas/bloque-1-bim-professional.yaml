titulo: "Bloque 1: BIM Professional"
tipo: "bloque"
estado: "publico"
destacado: false
resumen: "Un trimestre del Máster BIM + IA, cursable por separado y apilable hacia el máster completo. 4 módulos, con microcredencial al terminar."
descripcion: "Gestión y Transformación Digital de Proyectos. Comprender, estructurar e implementar BIM dentro de proyectos y organizaciones, utilizando estándares, protocolos y procesos de gestión de información. Resultado: comprende → estructura → implementa. Es el bloque 1 del Máster Internacional en BIM Management e IA: se cursa por separado, con microcredencial por módulo e insignia de especialista al completarlo, y suma hacia el título del máster."
paraQuien:
  - "Ingenieros Civiles y Arquitectos"
  - "Gerentes y Coordinadores de Proyectos"
  - "Coordinadores BIM que buscan escalar a BIM Manager"
  - "Jefes de obra, ingenieros residentes y diseñadores estructurales"
  - "Docentes universitarios del área de construcción"
  - "Profesionales en altos cargos que buscan liderar la transformación digital del sector"
modulos:
  - titulo: "Módulo 01: Estrategia BIM y Transformación Digital"
    descripcion: "Establece la visión estratégica del BIM como metodología de gestión de información: el rol del BIM Manager, los requisitos de información del cliente y del proyecto, los estándares que ordenan el trabajo y el flujo documental dentro de un entorno común de datos."
    sesiones:
      - titulo: "Introducción al BIM Management y transformación digital"
        duracion: "Clase + sesión práctica"
      - titulo: "Requisitos de información y gestión BIM: EIR, BEP y Matriz NOI"
        duracion: "Clase + sesión práctica"
      - titulo: "Estándares, normativas y organización BIM (ISO 19650)"
        duracion: "Clase + sesión práctica"
      - titulo: "CDE y flujo de información BIM: WIP, Shared, Published, Archive"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 02: Estándares BIM y Gestión de la Información"
    descripcion: "Desarrolla en profundidad la gestión de información según la ISO 19650 y la construcción de los documentos que gobiernan un proyecto BIM: EIR, AIR, BEP y protocolos de colaboración entre disciplinas."
    sesiones:
      - titulo: "ISO 19650 y gestión de información BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "EIR, AIR y requisitos de información"
        duracion: "Clase + sesión práctica"
      - titulo: "Desarrollo profesional del BEP"
        duracion: "Clase + sesión práctica"
      - titulo: "Protocolos BIM y flujos colaborativos"
        duracion: "Clase + sesión práctica"
  - titulo: "Módulo 03: Implementación BIM en Empresas y Proyectos"
    descripcion: "Lleva el BIM al plano organizacional: diagnosticar la madurez de una empresa, diseñar el roadmap de implementación, gestionar el cambio y auditar el cumplimiento para asegurar mejora continua."
    sesiones:
      - titulo: "Diagnóstico y madurez BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Plan de implementación BIM y roadmap"
        duracion: "Clase + sesión práctica"
      - titulo: "Gestión del cambio y adopción BIM"
        duracion: "Clase + sesión práctica"
      - titulo: "Auditoría BIM y mejora continua"
        duracion: "Clase + sesión práctica"
