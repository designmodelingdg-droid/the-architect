historia: |-
  Design Modeling Academy nació dentro de una oficina de ingeniería estructural en Quito. Los cursos que el equipo daba para sus propios proyectos, sobre Robot, ETABS, SAP2000 y Revit, empezaron a pedirse desde fuera, y la escuela se organizó para darlos en vivo, grabarlos y certificarlos.

  Hoy forma parte del grupo Design Modeling DG, junto con la consultoría y el software DG BIM Intelligence. Es Autodesk Authorized Training Center desde 2022 y el primer Authorized Partner de CYPE en Latinoamérica desde 2023, y emite títulos universitarios internacionales por convenio con Doctrinas Qualitas, ISTE y Sabal University.

  Lo que no ha cambiado es quién enseña: ingenieros y arquitectos que siguen calculando, modelando y coordinando proyectos reales.
